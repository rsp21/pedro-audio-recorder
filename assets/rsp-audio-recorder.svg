<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#64748b"/>
      <stop offset="0.48" stop-color="#334155"/>
      <stop offset="1" stop-color="#172033"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="stand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <clipPath id="grilleClip">
      <rect x="87" y="28" width="82" height="119" rx="41"/>
    </clipPath>
  </defs>

  <!-- Professional studio microphone mark; transparent outside the artwork. -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- subtle colored outline -->
    <rect x="82" y="23" width="92" height="129" rx="46" fill="none" stroke="url(#rim)" stroke-width="5"/>
    <!-- microphone capsule -->
    <rect x="87" y="28" width="82" height="119" rx="41" fill="url(#body)" stroke="#0f172a" stroke-width="5"/>
    <!-- fine grille detail -->
    <g clip-path="url(#grilleClip)" fill="none" stroke="#cbd5e1" stroke-width="2.5" opacity="0.72">
      <path d="M82 52 H174 M82 67 H174 M82 82 H174 M82 97 H174 M82 112 H174 M82 127 H174"/>
      <path d="M96 25 L167 96 M86 39 L169 122 M86 69 L155 138 M87 99 L125 137" opacity="0.58"/>
      <path d="M160 26 L88 98 M170 45 L88 127 M169 77 L117 145 M168 108 L143 145" opacity="0.36"/>
    </g>
    <!-- capsule highlight and lower seam -->
    <path d="M106 43 V107" fill="none" stroke="#e2e8f0" stroke-width="4" opacity="0.5"/>
    <path d="M94 124 Q128 141 162 124" fill="none" stroke="#0f172a" stroke-width="4" opacity="0.75"/>

    <!-- yoke and stand -->
    <path d="M69 112 V139 A59 59 0 0 0 187 139 V112" fill="none" stroke="#172033" stroke-width="10"/>
    <path d="M69 112 V139 A59 59 0 0 0 187 139 V112" fill="none" stroke="url(#rim)" stroke-width="4"/>
    <path d="M128 198 V154" fill="none" stroke="#172033" stroke-width="10"/>
    <path d="M128 198 V154" fill="none" stroke="url(#stand)" stroke-width="4"/>
    <path d="M91 224 H165" fill="none" stroke="#172033" stroke-width="12"/>
    <path d="M91 224 H165" fill="none" stroke="url(#stand)" stroke-width="5"/>
    <!-- small connector detail -->
    <rect x="119" y="194" width="18" height="10" rx="5" fill="#475569" stroke="#172033" stroke-width="3"/>
  </g>
</svg>
